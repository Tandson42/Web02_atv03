<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consultas do Médico</title>
</head>
<body>
<!-- Exemplo de uso do método dados() do domínio -->
<p th:text="${medico?.dados()}"></p>

<h3>Consultas do Dr(a). <span th:text="${medico?.nome}"></span></h3>
<!-- Exemplo de uso do método consultas() do domínio (retorna String) -->
<pre th:text="${medico?.consultas()}"></pre>

<table class="table" border="1">
  <thead>
  <tr>
    <th>Id</th>
    <th>Data</th>
    <th>Valor</th>
    <th>Observação</th>
    <th>Paciente</th>
  </tr>
  </thead>
  <tr th:each="c : ${consultas}">
    <td th:text="${c.id}"></td>
    <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></td>
    <td th:text="${c.valor}"></td>
    <td th:text="${c.observacao}"></td>
    <td th:text="${c.paciente?.nome}"></td>
  </tr>
</table>

<a th:href="@{/medico/list}">Voltar para a lista de médicos</a>
</body>
</html>
