<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Médico</title>
</head>
<body>
<h3>Página FORM de Médico!</h3>
<form th:action="${medico.id != null} ? @{/medico/update} : @{/medico/save}"
      method="post">
  <!-- sem o id, o JPA não sabe qual linha atualizar -->
  <input type="hidden" name="id" th:value="${medico?.id}"/>

  <label>Nome</label>
  <input type="text" name="nome" th:value="${medico?.nome}"/><br/>

  <label>CRM</label>
  <input type="text" name="crm" th:value="${medico?.crm}"/><br/>

  <button type="submit">Salvar</button>
</form>
<a th:href="@{/medico/list}">Voltar para a lista</a>
</body>
</html>
