<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Consulta</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <h3>Página FORM de Consulta!</h3>
            <form th:action="${consulta.id != null} ? @{/consulta/update} : @{/consulta/save}"
                  method="post">
                <!-- sem o id, o JPA não sabe qual linha atualizar -->
                <input type="hidden" name="id" th:value="${consulta?.id}"/>

                <div class="mb-3">
                    <label class="form-label">Data e Hora</label>
                    <input type="datetime-local" class="form-control" name="data"
                           th:value="${consulta?.data != null ? #temporals.format(consulta.data, 'yyyy-MM-dd''T''HH:mm') : ''}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Valor</label>
                    <input type="number" class="form-control" name="valor" step="0.01" th:value="${consulta?.valor}"/>
                </div>

                <div class="mb-3">
                    <label class="form-label">Observação</label>
                    <input type="text" class="form-control" name="observacao" th:value="${consulta?.observacao}"/>
                </div>

                <!-- Envia paciente.id: o Spring monta um Paciente só com o id,
                     e o JPA grava a referência (FK) na tabela tb_consulta.
                     Ao editar, o paciente atual vem pré-selecionado. -->
                <div class="mb-3">
                    <label class="form-label">Paciente</label>
                    <select class="form-select" name="paciente.id">
                        <option th:each="p : ${pacientes}"
                                th:value="${p.id}"
                                th:text="${p.nome}"
                                th:selected="${p.id == consulta?.paciente?.id}"></option>
                    </select>
                </div>

                <!-- Envia medico.id: o Spring monta um Medico só com o id,
                     e o JPA grava a referência (FK) na tabela tb_consulta. -->
                <div class="mb-3">
                    <label class="form-label">Médico</label>
                    <select class="form-select" name="medico.id">
                        <option th:each="m : ${medicos}"
                                th:value="${m.id}"
                                th:text="${m.nome}"
                                th:selected="${m.id == consulta?.medico?.id}"></option>
                    </select>
                </div>

                <button type="submit" class="btn btn-info text-white">Salvar</button>
            </form>
            <a th:href="@{/consulta/list}" class="btn btn-outline-secondary mt-2">Voltar para a lista</a>
        </div>
    </main>
</html>
