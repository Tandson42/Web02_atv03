<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Consultas</title>
</head>
<body>
<!-- Link para abrir o formulário de cadastro de uma nova consulta -->
<a th:href="@{/consulta/form}">Nova Consulta</a>

<table class="table" border="1">
  <thead>
  <tr>
    <th>Id</th>
    <th>Data</th>
    <th>Valor</th>
    <th>Observação</th>
    <th>Paciente</th>
    <th>Médico</th>
    <th colspan="2">Ações</th>
  </tr>
  </thead>
  <tr th:each="c : ${consultas}">
    <td th:text="${c.id}"></td>
    <td th:text="${#temporals.format(c.data, 'dd/MM/yyyy HH:mm')}"></td>
    <td th:text="${c.valor}"></td>
    <td th:text="${c.observacao}"></td>
    <td th:text="${c.paciente?.nome}"></td>
    <td th:text="${c.medico?.nome}"></td>

    <td> <a th:href="|/consulta/edit/${c.id}|">Editar</a> </td>
    <td> <a onclick="return window.confirm('Tem certeza que deseja excluir este registro?')"
           th:href="@{/consulta/remove/{id}(id=${c.id})}">Excluir</a> </td>
  </tr>
</table>
</body>
</html>
