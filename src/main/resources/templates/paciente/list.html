<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::head}, ~{::main})}">

    <head th:replace="~{fragments/head :: head(~{::title})}">
        <title>Pacientes</title>
    </head>

    <main th:fragment="main">
        <div class="container mt-4">
            <!-- Mensagem flash enviada após cadastro/edição bem-sucedidos -->
            <div class="alert alert-success" th:if="${mensagem != null}" th:text="${mensagem}"></div>

            <!-- Link para abrir o formulário de cadastro de um novo paciente -->
            <a th:href="@{/paciente/form}" class="btn btn-info text-white mb-3">Novo Paciente</a>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th colspan="3">Ações</th>
                    </tr>
                    </thead>
                    <tr th:each="p : ${pacientes}">
                        <td th:text="${p.id}"></td>
                        <td th:text="${p.nome}"></td>
                        <td th:text="${p.cpf}"></td>
                        <td th:text="${p.email}"></td>
                        <td th:text="${p.telefone}"></td>

                        <td> <a th:href="|/paciente/edit/${p.id}|">Editar</a> </td>
                        <td> <a onclick="return window.confirm('Tem certeza que deseja excluir este registro?')"
                               th:href="@{/paciente/remove/{id}(id=${p.id})}">Excluir</a> </td>
                        <!-- Visualizar todas as consultas de um paciente -->
                        <td> <a th:href="|/paciente/consultas/${p.id}|">Consultas</a> </td>
                    </tr>
                </table>
            </div>
        </div>
    </main>
</html>
